# Optional YAML configuration.
# Enable with: CONFIG_FILE=/config/config.yml (Docker) or --config config.yml

# input_dir: /data/in
# output_dir: /data/out
# backup: true
# backup_dir: /data/backup
# backup_retention_days: 30
# filename_filter: "*.m4b"
# recursive: false
# replicate_source_dir_structure: false
# output_suffix: false
# !!! WARNING: backup=true is STRONGLY RECOMMENDED with overwrite_source_file=true.
# Without a backup, the source file is overwritten irreversibly.
# overwrite_source_file: false
# overwrite_existing: false
# output_same_dir: false
# rename_suffix: "[TAGS_REMAPPED]"
# skip_suffix: true
# log_level: INFO
# loop: false
# loop_interval: 60

# Without tag_map and tag_rules, the default mapping applies:
# album -> series, track -> series-part, title -> album
tag_map:
  - from: album
    to: series
  - from: track
    to: series-part
  - from: title
    to: album

# Additional value replacements after the mapping:
# tag_rules:
#   - tag: album
#     old: Old Album
#     new: New Album
#   - tag: track
#     old: "3"
#     new: "7"
